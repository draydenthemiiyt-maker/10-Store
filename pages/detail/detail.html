<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Store</title>

    <link href="../../winjs/css/ui-light.css" rel="stylesheet" />
    <script src="../../winjs/js/base.js"></script>
    <script src="../../winjs/js/ui.js"></script>

    <script src="detail.js"></script>
    <link rel="stylesheet" href="detail.css" />
</head>
<body class="win-type-body">
    <div class="app-section">
        <img class="icon" src="../../placeholder.svg" alt="App Icon">
        
        <!-- Grouping these elements makes the layout much cleaner -->
        <div class="app-details">
            <h1 id="title" class="win-h1">LINE</h1>
            <p id="developer" class="win-p">LINE Corporation</p>
            <p id="rating" class="win-p">⭐⭐⭐⭐⭐</p>
            
            <button id="share" class="link-button">&#128279; Share</button>
            
            <p id="decShort" class="win-p">Enjoy Free Chat!  - A New Messenger has arrived</p>
            <button id="showfulldec" class="link-button">More</button>
            
            <p id="ownership" class="ownership">You own this product and you can install it on this device.</p>
            <hr class="spacer">
            
            <button id="install" class="win-button">Install</button>
        </div>
    </div>
</body>
</html>
